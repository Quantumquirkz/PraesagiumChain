apiVersion: apps/v1
kind: Deployment
metadata:
  name: praesagium-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praesagium-frontend
  template:
    metadata:
      labels:
        app: praesagium-frontend
    spec:
      containers:
        - name: frontend
          image: praesagium-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://praesagium-backend:4000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: praesagium-frontend
spec:
  selector:
    app: praesagium-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
