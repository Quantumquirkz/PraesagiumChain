name: Deploy PraesagiumChain

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run contract tests
        run: npm test
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Lint frontend
        run: cd frontend && npm run lint
      - name: Build frontend
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_CHAIN_ID: "11155111"
          NEXT_PUBLIC_RPC_URL: "https://rpc.sepolia.org"
          NEXT_PUBLIC_PREDICTION_MARKET_ADDRESS: "0x0000000000000000000000000000000000000000"
          NEXT_PUBLIC_BLOCK_EXPLORER_URL: "https://sepolia.etherscan.io"
      # Blocks on critical CVEs only; triage high locally (see docs/operations.md)
      - name: Security audit (npm root)
        run: npm audit --audit-level=critical
      - name: Security audit (npm frontend)
        run: cd frontend && npm audit --audit-level=critical

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (backend)
        run: cd backend-rust && cargo clippy -- -D warnings
      - name: Run backend tests
        run: npm run test:backend
      # Advisory DB may report transitive issues (ethers, sqlx); run `cargo audit` locally and track upgrades
      - name: Security audit (cargo)
        run: |
          cargo install cargo-audit 2>/dev/null || true
          cd backend-rust && cargo audit || true

