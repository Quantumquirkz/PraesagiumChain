name: Deploy PraesagiumChain

on:
  push:
    branches:
      - main
      - startup
  pull_request:
    branches:
      - main
      - startup
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed WASM under cre/
        run: |
          if git ls-files | grep -qE '^cre/.*\.wasm$'; then
            echo "::error::Do not commit .wasm files under cre/ (generated locally; see cre/.gitignore and cre/praesagium-resolver/README.md)"
            git ls-files | grep -E '^cre/.*\.wasm$' || true
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Compile contracts (Hardhat + sync CRE ABI)
        run: npm run compile
      - name: Run contract tests
        run: npm test
      - name: Lint frontend
        run: cd frontend && npm run lint
      - name: Run frontend unit tests (with coverage)
        run: cd frontend && npm run test:coverage
      - name: Build frontend
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_CHAIN_ID: "11155111"
          NEXT_PUBLIC_RPC_URL: "https://rpc.sepolia.org"
          NEXT_PUBLIC_PREDICTION_MARKET_ADDRESS: "0x0000000000000000000000000000000000000000"
          NEXT_PUBLIC_BLOCK_EXPLORER_URL: "https://sepolia.etherscan.io"
      # Blocks on critical CVEs only; see dependency-audit-high for high-severity triage
      - name: Security audit (npm)
        run: npm audit --audit-level=critical

  # High / moderate CVE visibility (transitive deps e.g. next-pwa/workbox may remain; triage before release)
  dependency-audit-high:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: npm audit (root, high)
        run: npm audit --audit-level=high
      - name: npm audit (frontend, high)
        run: cd frontend && npm ci && npm audit --audit-level=high

  # Static analysis — fails the job on Slither high-or-critical findings
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Slither and solc (static analysis)
        run: |
          pip install slither-analyzer solc-select
          solc-select install 0.8.28
          solc-select use 0.8.28
      # Hardhat 3 artifacts live under build/hardhat-artifacts; Slither uses Crytic compile with solc + remaps (Cancun).
      - name: Run Slither
        run: npm run slither:ci

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (backend)
        run: cd backend && cargo clippy -- -D warnings
      - name: Run backend tests
        run: npm run test:backend
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1
      - name: Security audit (cargo)
        run: cd backend && cargo audit

  cre-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CRE workflow deps (standard resolver)
        run: |
          cd cre/praesagium-resolver && npm ci --ignore-scripts
      - name: Typecheck CRE workflow (standard)
        run: cd cre/praesagium-resolver && npx tsc --noEmit -p tsconfig.json
      - name: Install CRE workflow deps (confidential)
        run: |
          cd cre/praesagium-resolver-confidential && npm ci --ignore-scripts
      - name: Typecheck CRE workflow (confidential)
        run: cd cre/praesagium-resolver-confidential && npx tsc --noEmit -p tsconfig.json

  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PORT: "4000"
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build backend
        run: cd backend && cargo build
      - name: Start backend and smoke /health
        run: |
          cd backend && cargo run &
          sleep 20
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "http://127.0.0.1:${PORT}/health" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') is True, d"

