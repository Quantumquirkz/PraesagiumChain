services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: praesagium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praesagium}
      POSTGRES_DB: praesagium
    ports:
      - "5433:5432"
    volumes:
      - praesagium_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praesagium"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - praesagium_chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  praesagium_pgdata:
  praesagium_chdata:
