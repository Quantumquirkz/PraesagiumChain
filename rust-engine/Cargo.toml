[package]
name = "praesagium-phpe"
version = "0.1.0"
edition = "2021"
description = "Praesagium Hybrid Predictive Engine - motor de predicción para mercados descentralizados"

[dependencies]
ndarray = "0.16"
rand = { version = "0.8", features = ["std_rng"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
approx = "0.5"
